  <text x="150" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Monaco · Vite · Socket.io</text>
  <rect x="340" y="80" width="220" height="90" rx="8" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
