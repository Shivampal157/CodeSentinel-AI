  <text x="220" y="305" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Users · PRs · Reviews</text>
  <rect x="500" y="250" width="200" height="80" rx="8" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="285" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Redis</text>
  <text x="600" y="305" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Cache · Queues · Pub/Sub</text>
  <rect x="880" y="250" width="200" height="80" rx="8" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
  <text x="980" y="285" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Qdrant</text>
