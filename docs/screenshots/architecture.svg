  <text x="620" y="530" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">7. Live status via Socket.io</text>
  <text x="620" y="560" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">8. Findings + debt score</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
