  <text x="130" y="560" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">4. Retrieve related code</text>
  <text x="620" y="470" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">5. Claude grounded review</text>
