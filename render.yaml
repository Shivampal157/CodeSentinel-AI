# CodeSentinel AI — Render Blueprint
# Dashboard: New → Blueprint → connect Shivampal157/CodeSentinel-AI
# Fill secret env vars when prompted, then redeploy web after API URL is known.

services:
  - type: web
    name: codesentinel-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: QDRANT_COLLECTION
        value: code_chunks
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: codesentinel-worker
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build:worker
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: QDRANT_COLLECTION
        value: code_chunks
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: codesentinel-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
